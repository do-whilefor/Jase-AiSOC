[package]
name = "blue_team_rust"
version = "0.0.1"
edition = "2021"
description = "Optional Rust-accelerated pure helpers for the Blue Team AI Agent"
publish = false

[lib]
name = "blue_team_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["abi3-py312", "extension-module"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
