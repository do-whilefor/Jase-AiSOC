name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run lint
        run: uv run ruff check .

      - name: Run type checks
        run: uv run mypy src tests migrations

      - name: Verify checked-in contract schemas
        run: uv run aisoc-export-schemas --check

      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

  supply-chain:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Audit Python dependencies
        run: uv run pip-audit --skip-editable

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p reports
          uv run cyclonedx-py environment \
            --output-format JSON \
            --output-file reports/sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-python-${{ github.sha }}
          path: reports/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  integration:
    name: PostgreSQL migration and API integration
    runs-on: ubuntu-latest
    env:
      AISOC_DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_test@127.0.0.1:5432/aisoc
      AISOC_TEST_DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_test@127.0.0.1:5432/aisoc
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: aisoc
          POSTGRES_USER: aisoc
          POSTGRES_PASSWORD: aisoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisoc -d aisoc"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Apply and verify migrations
        run: |
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

      - name: Run PostgreSQL integration tests
        run: uv run pytest -m integration -vv

  rust-extension:
    name: Check Rust core and Python bridge
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies and maturin
        run: |
          uv sync --locked --all-groups
          uv tool install maturin==1.14.1

      - name: Format, check, lint, and test the Cargo workspace
        run: |
          cargo fmt --check --all
          cargo check --workspace
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace

      - name: Build and install the Python bridge into the venv
        run: |
          VIRTUAL_ENV="$(pwd)/.venv" maturin develop --locked \
            --manifest-path crates/aisoc-python/Cargo.toml

      - name: Verify the bridge and run Rust-enabled unit tests
        run: |
          uv run python -c "import aisoc_rust; print(aisoc_rust.version())"
          uv run pytest tests/unit -q

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked --version "0.21.2" --no-default-features
          cargo audit --file Cargo.lock

  build:
    name: Build Python and container artifacts
    needs: [quality, supply-chain, integration, rust-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.24"
          python-version: "3.12"
          enable-cache: true

      - name: Build release Rust bridge wheel
        run: |
          uv tool install maturin==1.14.1
          mkdir -p dist-rust
          maturin build --locked --release \
            --manifest-path crates/aisoc-python/Cargo.toml \
            --out dist-rust

      - name: Build Python wheel and source distribution
        run: uv build

      - name: Build runtime container
        run: docker build --file deploy/Dockerfile --tag aisoc-security-platform:${{ github.sha }} .

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist-${{ github.sha }}
          path: |
            dist/*
            dist-rust/*
          if-no-files-found: error
          retention-days: 30
