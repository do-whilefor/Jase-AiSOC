name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check --diff .

      - name: Run lint
        run: uv run ruff check --output-format=github .

      - name: Run type checks
        run: uv run mypy --show-error-codes src tests migrations

      - name: Verify checked-in contract schemas
        run: |
          uv run aisoc-export-schemas --check
          python3 scripts/check_v4_contract_schemas.py

      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

  supply-chain:
    name: Python dependency audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Audit Python dependencies
        run: uv run pip-audit --skip-editable

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p reports
          uv run cyclonedx-py environment \
            --output-format JSON \
            --output-file reports/sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-python-${{ github.sha }}
          path: reports/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  integration:
    name: Legacy Python PostgreSQL regression (migration-only compatibility)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AISOC_DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_test@127.0.0.1:5432/aisoc
      AISOC_TEST_DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_test@127.0.0.1:5432/aisoc
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: aisoc
          POSTGRES_USER: aisoc
          POSTGRES_PASSWORD: aisoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisoc -d aisoc"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Apply and verify migrations
        run: |
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

      - name: Run PostgreSQL integration tests
        run: uv run pytest -m integration -vv

  deploy:
    name: Release install, upgrade, rollback, and signature gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise deployment lifecycle
        run: make deploy-check

  rust:
    name: Rust 1.82 quality, tests, PostgreSQL migrations, bridge, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AISOC_DATABASE_URL: postgresql://aisoc:aisoc-ci@127.0.0.1:5432/aisoc
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: aisoc
          POSTGRES_USER: aisoc
          POSTGRES_PASSWORD: aisoc-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisoc -d aisoc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked Python dependencies and maturin
        run: |
          uv sync --locked --all-groups
          uv tool install maturin==1.14.1

      - name: Verify Rust-first production entrypoints
        run: bash ./scripts/check-rust-first.sh

      - name: Verify committed Cargo.lock is immutable and complete
        run: |
          bash ./scripts/check-cargo-lock.sh
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Verify native SQLx migration and central repository structure
        run: |
          python3 scripts/check-sqlx-migrations.py
          python3 scripts/check-central-repository.py

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check and lint Cargo workspace
        run: |
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Apply and verify native PostgreSQL migrations
        run: |
          cargo run --locked -p aisoc-storage --bin aisoc-db -- migrate
          cargo run --locked -p aisoc-storage --bin aisoc-db -- health

      - name: Run Rust tests, central repository integration, and verify contract schemas
        run: |
          cargo test --locked --workspace
          cargo test --locked -p aisoc-storage --test central_repository -- --nocapture
          python3 scripts/check_v4_contract_schemas.py
          cargo run --locked -p aisoc-contracts --bin export_schemas -- /tmp/aisoc-rust-schemas

      - name: Build and install the Python bridge into the venv
        run: |
          VIRTUAL_ENV="$(pwd)/.venv" maturin develop --locked \
            --manifest-path crates/aisoc-python/Cargo.toml

      - name: Verify the bridge and run Rust-enabled unit tests
        run: |
          uv run python -c "import aisoc_rust; print(aisoc_rust.version())"
          uv run pytest tests/unit -q

      - name: Audit Rust dependencies
        run: |
          # cargo-audit 0.22.x requires Rust 1.88; 0.21.2 supports this workspace's Rust 1.82 MSRV.
          cargo install cargo-audit --locked --version "0.21.2" --no-default-features
          cargo audit --file Cargo.lock

      - name: Generate Rust CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked --version "0.5.7"
          cargo cyclonedx --format json --all-features

      - name: Upload Rust SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-rust-${{ github.sha }}
          path: |
            bom.json
            crates/*/bom.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build release artifacts and containers
    needs: [quality, supply-chain, integration, deploy, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.82.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true

      - name: Verify committed Cargo.lock for release build
        run: |
          bash ./scripts/check-rust-first.sh
          bash ./scripts/check-cargo-lock.sh
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Build V4 Rust production binaries
        run: |
          cargo build --locked --release \
            -p aisoc-agent \
            -p aisoc-ingest \
            -p aisoc-api \
            -p aisoc-console \
            -p aisoc-web-guard \
            -p aisoc-storage

      - name: Package checksum-verified Rust release bundle
        run: |
          AISOC_RELEASE_OUTPUT_ROOT=dist/rust-release \
            bash ./scripts/package-rust-release.sh "${GITHUB_SHA}"

      - name: Build release Rust bridge wheel
        run: |
          uv tool install maturin==1.14.1
          mkdir -p dist-rust
          maturin build --locked --release \
            --manifest-path crates/aisoc-python/Cargo.toml \
            --out dist-rust

      - name: Build Python wheel and source distribution
        run: uv build

      - name: Build Rust-only Web Guard container
        run: docker build --file deploy/Dockerfile.web-guard --tag aisoc-web-guard:${{ github.sha }} .

      - name: Build Rust V4 runtime container
        run: docker build --file deploy/Dockerfile --tag aisoc-security-platform:${{ github.sha }} .

      - name: Build migration-only Python runtime container
        run: docker build --file deploy/Dockerfile.legacy-python --tag aisoc-security-platform-legacy:${{ github.sha }} .

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist-${{ github.sha }}
          path: |
            dist/*
            dist-rust/*
            target/release/aisoc-agent
            target/release/aisoc-ingest
            target/release/aisoc-api
            target/release/aisoc-console
            target/release/aisoc-web-guard
          if-no-files-found: error
          retention-days: 30

  gate:
    name: CI gate
    if: always()
    needs: [quality, supply-chain, integration, deploy, rust, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI stages to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          printf 'quality=%s\nsupply-chain=%s\nintegration=%s\ndeploy=%s\nrust=%s\nbuild=%s\n' \
            "$QUALITY_RESULT" "$SUPPLY_CHAIN_RESULT" "$INTEGRATION_RESULT" \
            "$DEPLOY_RESULT" "$RUST_RESULT" "$BUILD_RESULT"
          test "$QUALITY_RESULT" = success
          test "$SUPPLY_CHAIN_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$DEPLOY_RESULT" = success
          test "$RUST_RESULT" = success
          test "$BUILD_RESULT" = success
