[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aisoc-security-platform"
version = "0.0.1"
description = "Evidence-first Linux security analysis and response platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
  { name = "AI-SOC Contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "aiohttp>=3.10,<4",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=50.0.0,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uvicorn>=0.35,<1",
  "yara-x>=1.19.0",
]

[project.scripts]
aisoc-agent = "aisoc.agent_core.__main__:main"
aisoc-api = "aisoc.api_server.__main__:main"
aisoc-ingest = "aisoc.ingest_gateway.__main__:main"
aisoc-export-schemas = "aisoc.domain.schema_export:main"
aisoc-probe-platform = "aisoc.platform.__main__:main"
aisoc-process = "aisoc.process.__main__:main"
aisoc-malware-worker = "aisoc.malware_engine.__main__:main"
aisoc-notification-worker = "aisoc.notification_engine.__main__:main"
aisoc-response-worker = "aisoc.response_engine.__main__:main"

[dependency-groups]
dev = [
  "cyclonedx-bom>=7.1,<8",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
  "types-jsonschema>=4.25,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aisoc"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires external infrastructure such as PostgreSQL",
]

[tool.coverage.run]
branch = true
source = ["aisoc"]

[tool.coverage.report]
show_missing = true
skip_covered = true
