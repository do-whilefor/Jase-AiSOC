[workspace]
members = ["crates/aisoc-contracts"]
default-members = ["crates/aisoc-contracts"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.82"

[workspace.dependencies]
chrono = { version = "=0.4.41", default-features = false, features = ["serde", "std"] }
schemars = "=0.8.22"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
