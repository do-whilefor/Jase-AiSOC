name: aisoc-p2-rust

# Rust-only P2 laboratory profile. PostgreSQL is initialized through native
# SQLx migrations before Agent/Ingest/API startup. PostgreSQL is the central repository;
# full Agent enrollment/collector VM matrix and P3 stream profile remain open gates.
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: aisoc
      POSTGRES_USER: aisoc
      POSTGRES_PASSWORD: aisoc-local-development-only
    volumes:
      - p2-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisoc -d aisoc"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-migrate:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    command: ["/usr/local/bin/aisoc-db", "migrate"]
    environment:
      AISOC_DATABASE_URL: postgresql://aisoc:aisoc-local-development-only@postgres:5432/aisoc
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  secrets-init:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        mkdir -p /run/aisoc-secrets
        printf '%s\n' '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' > /run/aisoc-secrets/ingest-proxy.secret
        printf '%s\n' 'abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789' > /run/aisoc-secrets/ingest-control.secret
        cat > /run/aisoc-secrets/api-auth.json <<'JSON'
        {"principals":[{"token_sha256":"f1a458d2e3fa294262a087f07c804db44e97b95b2cb0ccef7a09825f661a1f4d","subject":"local-admin","tenant_id":"ten_local001","roles":["admin"]}]}
        JSON
        chown -R 10001:10001 /run/aisoc-secrets
        chmod 0600 /run/aisoc-secrets/*
    volumes:
      - p2-secrets:/run/aisoc-secrets
    restart: "no"

  ingest:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    command: ["/usr/local/bin/aisoc-ingest"]
    environment:
      AISOC_DATABASE_URL: postgresql://aisoc:aisoc-local-development-only@postgres:5432/aisoc
      AISOC_INGEST_BIND: 127.0.0.1:8080
      AISOC_INGEST_STATE_DIR: /var/lib/aisoc-ingest
      AISOC_INGEST_OBJECT_STORE_ROOT: /var/lib/aisoc-raw-evidence
      AISOC_INGEST_PROXY_SECRET_FILE: /run/aisoc-secrets/ingest-proxy.secret
      AISOC_INGEST_CONTROL_SECRET_FILE: /run/aisoc-secrets/ingest-control.secret
      RUST_LOG: aisoc_ingest=info
    ports:
      - "127.0.0.1:58000:8000"
      - "127.0.0.1:58088:8088"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - p2-secrets:/run/aisoc-secrets:ro
      - p2-ingest-state:/var/lib/aisoc-ingest
      - p2-raw-evidence:/var/lib/aisoc-raw-evidence
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    command: ["/usr/local/bin/aisoc-api"]
    network_mode: "service:ingest"
    environment:
      AISOC_API_BIND: 0.0.0.0:8000
      AISOC_DATABASE_URL: postgresql://aisoc:aisoc-local-development-only@postgres:5432/aisoc
      AISOC_API_AUTH_FILE: /run/aisoc-secrets/api-auth.json
      AISOC_INGEST_CONTROL_SECRET_FILE: /run/aisoc-secrets/ingest-control.secret
      AISOC_INGEST_CONTROL_ORIGIN: http://127.0.0.1:8080
      RUST_LOG: aisoc_api=info
    depends_on:
      ingest:
        condition: service_healthy
    volumes:
      - p2-secrets:/run/aisoc-secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  console:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    command: ["/usr/local/bin/aisoc-console"]
    network_mode: "service:ingest"
    environment:
      AISOC_CONSOLE_BIND: 0.0.0.0:8088
      AISOC_CONSOLE_API_ORIGIN: http://127.0.0.1:8000
    depends_on:
      api:
        condition: service_healthy

  agent-probe:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    command: ["/usr/local/bin/aisoc-agent", "probe"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  p2-secrets:
  p2-ingest-state:
  p2-raw-evidence:
  p2-postgres:
