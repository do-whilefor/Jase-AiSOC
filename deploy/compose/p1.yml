name: aisoc-p1

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: aisoc
      POSTGRES_USER: aisoc
      POSTGRES_PASSWORD: aisoc_dev
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisoc -d aisoc"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - p1-postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      AISOC_DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_dev@postgres:5432/aisoc
      AISOC_OBJECT_STORE_ROOT: /var/lib/aisoc/evidence
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    environment:
      AISOC_ENVIRONMENT: development
      AISOC_API_HOST: 0.0.0.0
      AISOC_API_PORT: 8000
      AISOC_LOG_FORMAT: json
      AISOC_DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_dev@postgres:5432/aisoc
      AISOC_OBJECT_STORE_ROOT: /var/lib/aisoc/evidence
      AISOC_BOOTSTRAP_ADMIN_TOKEN: p1-local-admin-token-change-me
    ports:
      - "127.0.0.1:58000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - p1-evidence-data:/var/lib/aisoc/evidence

volumes:
  p1-postgres-data:
  p1-evidence-data:
