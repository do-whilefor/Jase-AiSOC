name: blue-team-ai-p1

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: blue_team
      POSTGRES_USER: blue_team
      POSTGRES_PASSWORD: blue_team_dev
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blue_team -d blue_team"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - p1-postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      BLUE_TEAM_DATABASE_URL: postgresql+asyncpg://blue_team:blue_team_dev@postgres:5432/blue_team
      BLUE_TEAM_OBJECT_STORE_ROOT: /var/lib/blue-team/evidence
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    environment:
      BLUE_TEAM_ENVIRONMENT: development
      BLUE_TEAM_API_HOST: 0.0.0.0
      BLUE_TEAM_API_PORT: 8000
      BLUE_TEAM_LOG_FORMAT: json
      BLUE_TEAM_DATABASE_URL: postgresql+asyncpg://blue_team:blue_team_dev@postgres:5432/blue_team
      BLUE_TEAM_OBJECT_STORE_ROOT: /var/lib/blue-team/evidence
      BLUE_TEAM_BOOTSTRAP_ADMIN_TOKEN: p1-local-admin-token-change-me
    ports:
      - "127.0.0.1:58000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - p1-evidence-data:/var/lib/blue-team/evidence

volumes:
  p1-postgres-data:
  p1-evidence-data:
