[package]
name = "aisoc-web-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust-native reverse proxy and deterministic Web Guard data plane"
publish = false

[dependencies]
aisoc-ai = { path = "../aisoc-ai" }
aisoc-contracts = { path = "../aisoc-contracts" }
aisoc-core = { path = "../aisoc-core" }
axum = "=0.8.3"
chrono.workspace = true
percent-encoding = "=2.3.1"
reqwest = { version = "=0.12.15", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "=1.44.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt", "json"] }
unicode-normalization = "=0.1.24"
url = "=2.5.4"
uuid = { version = "=1.16.0", features = ["v4"] }
