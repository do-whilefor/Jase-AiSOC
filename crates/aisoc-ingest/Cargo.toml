[package]
name = "aisoc-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tenant-bound event ingest validation, idempotency, and backpressure"
publish = false

[dependencies]
aisoc-normalize = { path = "../aisoc-normalize" }
aisoc-incident = { path = "../aisoc-incident" }
aisoc-detection = { path = "../aisoc-detection" }
aisoc-contracts = { path = "../aisoc-contracts" }
aisoc-core = { path = "../aisoc-core" }
aisoc-storage = { path = "../aisoc-storage" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
axum = "=0.8.3"
tokio = { version = "=1.44.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt", "json"] }
uuid.workspace = true
