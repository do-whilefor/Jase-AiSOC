[package]
name = "aisoc-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PyO3 bridge for the AI-SOC Rust core"
publish = false

[lib]
name = "aisoc_rust"
crate-type = ["cdylib"]

[dependencies]
aisoc-core = { path = "../aisoc-core" }
pyo3 = { version = "0.29", features = ["abi3-py312", "extension-module"] }
